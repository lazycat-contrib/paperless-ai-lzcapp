lzc-sdk-version: "0.1"
name: Paperless AI
package: cloud.lazycat.app.paperless-ai
version: 2.6.5
description: 通过自然对话与您的Paperless-ngx文档交互的工具
homepage: https://clusterzx.github.io/paperless-ai
author: clusterzx
application:
  subdomain: paperless-ai
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  routes:
    - /=http://paperless-ai.cloud.lazycat.app.paperless-ai.lzcapp:3000/
services:
  paperless-ai:
    image: registry.lazycat.cloud/czyt/clusterzx/paperless-ai:d818e3d773e270dd
    binds:
      - /lzcapp/var/data:/app/data
    environment:
      - PAPERLESS_AI_INITIAL_SETUP=yes
      - PAPERLESS_API_URL=http://localhost:8000/api
      - PAPERLESS_API_TOKEN=xxxxxxxxxxxxxxxxxxxx
      - PAPERLESS_USERNAME=lazycat
      - AI_PROVIDER=custom
      - OPENAI_API_KEY=
      - OPENAI_MODEL=
      - OLLAMA_API_URL=http://localhost:11434
      - OLLAMA_MODEL=llama3.2
      - SCAN_INTERVAL=*/30 * * * *
      - PROCESS_PREDEFINED_DOCUMENTS=yes
      - TAGS=pre-process
      - ADD_AI_PROCESSED_TAG=no
      - AI_PROCESSED_TAG_NAME=ai-processed
      - USE_PROMPT_TAGS=no
      - PROMPT_TAGS=
      - USE_EXISTING_DATA=no
      - API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - CUSTOM_API_KEY=xxxxxxxxxxxxxxxxxxxxxxx
      - CUSTOM_BASE_URL=https://api.deepseek.com/v1
      - CUSTOM_MODEL=deepseek-chat
