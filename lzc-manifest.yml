application:
  subdomain: paperless-ai
  background_task: true
  multi_instance: false
  upstreams:
    - location: /
      backend: http://paperless-ai.cloud.lazycat.app.paperless-ai.lzcapp:3000/
services:
  paperless-ai:
    # upstream: clusterzx/paperless-ai:4.0.0
    image: registry.lazycat.cloud/czyt/clusterzx/paperless-ai:1d33caa8efd1774d
    binds:
      - /lzcapp/var/data:/app/data
    environment:
      - PAPERLESS_AI_INITIAL_SETUP=yes
      - PAPERLESS_API_URL=http://localhost:8000/api
      - PAPERLESS_API_TOKEN={{ stable_secret "paperless_api_token" }}
      - PAPERLESS_USERNAME=lazycat
      - AI_PROVIDER=custom
      - OPENAI_API_KEY=
      - OPENAI_MODEL=
      - OLLAMA_API_URL=http://localhost:11434
      - OLLAMA_MODEL=llama3.2
      - SCAN_INTERVAL=*/30 * * * *
      - PROCESS_PREDEFINED_DOCUMENTS=yes
      - TAGS=pre-process
      - ADD_AI_PROCESSED_TAG=no
      - AI_PROCESSED_TAG_NAME=ai-processed
      - USE_PROMPT_TAGS=no
      - PROMPT_TAGS=
      - USE_EXISTING_DATA=no
      - API_KEY={{ stable_secret "api_key" }}
      - CUSTOM_API_KEY={{ stable_secret "custom_api_key" }}
      - CUSTOM_BASE_URL=https://api.deepseek.com/v1
      - CUSTOM_MODEL=deepseek-chat
